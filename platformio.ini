[platformio]
src_dir = paraglide_vario_ESP32
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; PSRAM (needed for voice alerts) and USB serial output
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit BMP5xx Library
    adafruit/Adafruit SHTC3 Library
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson
    h2zero/NimBLE-Arduino
    jgromes/RadioLib
    mikalhart/TinyGPSPlus
    olikraus/U8g2
    solderedelectronics/Soldered PCF85063A RTC Library

[env:native]
platform = native
test_framework = googletest
test_build_src = no
test_ignore = test_device
lib_compat_mode = off
build_flags =
    -std=gnu++17
    -I$PROJECT_DIR/test/test_native/stubs
    -I$PROJECT_DIR/test/test_native/tinygps
lib_deps =
    mikalhart/TinyGPSPlus
    